<svg width="500" height="100" viewBox="0 0 500 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26215C"/>
      <stop offset="55%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26215C"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
  </defs>

  <!-- Mini hex symbol -->
  <g transform="translate(10, 20)">
    <polygon points="30,0 60,17.3 60,52 30,69.3 0,52 0,17.3" fill="url(#hexFill)" stroke="#534AB7" stroke-width="1"/>
    <ellipse cx="30" cy="34" rx="16" ry="6" fill="none" stroke="#5DCAA5" stroke-width="0.8"/>
    <ellipse cx="30" cy="34" rx="10" ry="4" fill="none" stroke="#9FE1CB" stroke-width="0.6"/>
    <polyline points="14,21 30,44 46,21" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="17" r="4" fill="#EF9F27"/>
    <circle cx="30" cy="17" r="2" fill="#FAC775"/>
  </g>

  <!-- VRGT text -->
  <text x="130" y="65" font-size="40" font-weight="600" letter-spacing="6" fill="url(#vGrad)" font-family="system-ui, -apple-system, sans-serif">VRGT</text>

  <!-- Separator -->
  <line x1="255" y1="25" x2="255" y2="75" stroke="#D3D1C7" stroke-width="1"/>

  <!-- Expanded name stacked -->
  <text x="270" y="50" font-size="12" fill="#534AB7" letter-spacing="1" font-weight="600" font-family="system-ui, -apple-system, sans-serif">VERTEX REALM</text>
  <text x="270" y="70" font-size="12" fill="#1D9E75" letter-spacing="1" font-weight="600" font-family="system-ui, -apple-system, sans-serif">GLOBAL TECHNOLOGIES</text>
</svg>