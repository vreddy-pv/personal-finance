<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26215C"/>
      <stop offset="55%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26215C"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
  </defs>

  <!-- Outer hex -->
  <polygon points="100,14 172,48.6 172,131.8 100,166.4 28,131.8 28,48.6" fill="url(#hexFill)" stroke="#534AB7" stroke-width="2"/>

  <!-- Inner hex ring -->
  <polygon points="100,28 158,61 158,125 100,158 42,125 42,61" fill="none" stroke="#AFA9EC" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Realm orbital rings -->
  <ellipse cx="100" cy="90" rx="48" ry="18" fill="none" stroke="#5DCAA5" stroke-width="1"/>
  <ellipse cx="100" cy="90" rx="65" ry="27" fill="none" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="4,3"/>
  <ellipse cx="100" cy="90" rx="32" ry="12" fill="none" stroke="#9FE1CB" stroke-width="0.8"/>

  <!-- Vertical axis line -->
  <line x1="100" y1="50" x2="100" y2="130" stroke="#5DCAA5" stroke-width="0.8"/>

  <!-- Bold V mark -->
  <polyline points="60,55 100,120 140,55" fill="none" stroke="#EEEDFE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="60,55 100,120 140,55" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertex apex amber dot -->
  <circle cx="100" cy="48" r="8" fill="#3C3489"/>
  <circle cx="100" cy="48" r="5.5" fill="#EF9F27"/>
  <circle cx="100" cy="48" r="2.5" fill="#FAC775"/>
</svg>