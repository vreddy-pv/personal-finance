version: '3.8'

services:
  login-service:
    build:
      context: ./services/login
      dockerfile: Dockerfile
    container_name: pf-login-service
    ports:
      - "8001:8001"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pf-network

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: pf-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_H2_CONSOLE_ENABLED=true
    depends_on:
      login-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pf-network

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: pf-mcp-server
    ports:
      - "8082:8000"
    environment:
      - BACKEND_API_URL=http://backend:8080
      - LOGIN_SERVICE_URL=http://login-service:8001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - pf-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: pf-frontend
    ports:
      - "4200:4200"
    environment:
      - API_BASE_URL=http://backend:8080
      - LOGIN_SERVICE_URL=http://login-service:8001
      - MCP_BASE_URL=http://mcp-server:8000
    depends_on:
      - backend
      - login-service
    command: ng serve --host 0.0.0.0 --poll=2000 --disable-host-check
    networks:
      - pf-network

networks:
  pf-network:
    driver: bridge
