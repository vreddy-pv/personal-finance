version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: pf-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: personalfinance
      MYSQL_USER: pfuser
      MYSQL_PASSWORD: pfpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pf-network

  login-service:
    build:
      context: ./services/login
      dockerfile: Dockerfile
    container_name: pf-login-service
    ports:
      - "8001:8001"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - BACKEND_URL=http://backend:8080
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001
    networks:
      - pf-network

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: pf-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mariadb:3306/personalfinance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=pfuser
      - SPRING_DATASOURCE_PASSWORD=pfpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=always
    depends_on:
      mariadb:
        condition: service_healthy
      login-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pf-network

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: pf-mcp-server
    ports:
      - "8082:8000"
    environment:
      - BACKEND_API_URL=http://backend:8080
      - LOGIN_SERVICE_URL=http://login-service:8001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - backend
    networks:
      - pf-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: pf-frontend
    ports:
      - "4200:4200"
    environment:
      - API_BASE_URL=http://backend:8080
      - LOGIN_SERVICE_URL=http://login-service:8001
      - MCP_BASE_URL=http://mcp-server:8000
    depends_on:
      - backend
      - login-service
    networks:
      - pf-network

networks:
  pf-network:
    driver: bridge

volumes:
  mariadb-data:
